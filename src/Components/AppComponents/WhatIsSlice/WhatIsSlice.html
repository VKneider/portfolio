<div class="whatisslice-container">
  <section class="manifesto-hero">
    <div class="hero-copy">
      <p class="eyebrow" data-t="what.manifesto"></p>
      <h1 data-t="what.title"></h1>
      <p data-t="what.intro"></p>
      <p class="hero-emphasis" data-t="what.purpose"></p>
      <ul class="hero-tags" data-t="what.aria.values" aria-label>
        <li data-t="what.values.webComponents"></li>
        <li data-t="what.values.learning"></li>
        <li data-t="what.values.architecture"></li>
      </ul>
    </div>

    <div class="hero-visual" aria-hidden="true">
      <div class="logo-panel">
        <img src="/images/Slice.js-logo.png" alt="Slice.js Logo" class="slice-logo">
        <p class="logo-caption" data-t="what.logoCaption"></p>
      </div>
    </div>
  </section>

  <section class="narrative-strip" data-t="what.aria.narrative" aria-label>
    <article class="narrative-card">
      <h2 data-t="what.narrative.why.title"></h2>
      <p data-t="what.narrative.why.text"></p>
    </article>

    <article class="narrative-card">
      <h2 data-t="what.narrative.how.title"></h2>
      <p data-t="what.narrative.how.text"></p>
    </article>

    <article class="narrative-card">
      <h2 data-t="what.narrative.not.title"></h2>
      <p data-t="what.narrative.not.text"></p>
    </article>
  </section>

  <section class="ecosystem-section">
    <div class="section-head">
      <p class="eyebrow" data-t="what.ecosystem.eyebrow"></p>
      <h2 data-t="what.ecosystem.title"></h2>
      <p data-t="what.ecosystem.description"></p>
    </div>
    <div class="ecosystem-grid"></div>
  </section>

  <section class="collaborate-section">
    <div class="section-head">
      <p class="eyebrow" data-t="what.collaborate.eyebrow"></p>
      <h2 data-t="what.collaborate.title"></h2>
    </div>
    <ul>
      <li data-t="what.collaborate.issues"></li>
      <li data-t="what.collaborate.docs"></li>
      <li data-t="what.collaborate.experiments"></li>
    </ul>
  </section>

  <section class="closing-motto">
    <p data-t="what.closing"></p>
  </section>
</div>
