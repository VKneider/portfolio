<div class="about-container">
  <section class="hero-section">
    <div class="hero-background-elements">
      <div class="floating-element element-1"></div>
      <div class="floating-element element-2"></div>
      <div class="floating-element element-3"></div>
      <div class="floating-element element-4"></div>
    </div>
    <div class="hero-content"></div>
  </section>

  <div class="about-sections">
    <section class="about-content"></section>

    <section class="currently-section">
      <p class="eyebrow" data-t="about.currently.eyebrow"></p>
      <h2 data-t="about.currently.title"></h2>
      <div class="currently-grid">
        <div class="currently-main">
          <p data-t="about.currently.description"></p>
          <p class="currently-note" data-t="about.currently.note"></p>
        </div>
        <dl class="currently-meta">
          <div>
            <dt data-t="about.currently.focus.label"></dt>
            <dd data-t="about.currently.focus.value"></dd>
          </div>
          <div>
            <dt data-t="about.currently.location.label"></dt>
            <dd data-t="about.currently.location.value"></dd>
          </div>
          <div>
            <dt data-t="about.currently.mode.label"></dt>
            <dd data-t="about.currently.mode.value"></dd>
          </div>
        </dl>
      </div>
    </section>

    <section class="outcomes-section">
      <p class="eyebrow" data-t="about.outcomes.eyebrow"></p>
      <h2 data-t="about.outcomes.title"></h2>
      <ol class="outcomes-list">
        <li>
          <span class="outcomes-num" aria-hidden="true">01</span>
          <div>
            <h3 data-t="about.outcomes.items.lead.title"></h3>
            <p data-t="about.outcomes.items.lead.text"></p>
          </div>
        </li>
        <li>
          <span class="outcomes-num" aria-hidden="true">02</span>
          <div>
            <h3 data-t="about.outcomes.items.slice.title"></h3>
            <p data-t="about.outcomes.items.slice.text"></p>
          </div>
        </li>
        <li>
          <span class="outcomes-num" aria-hidden="true">03</span>
          <div>
            <h3 data-t="about.outcomes.items.teaching.title"></h3>
            <p data-t="about.outcomes.items.teaching.text"></p>
          </div>
        </li>
        <li>
          <span class="outcomes-num" aria-hidden="true">04</span>
          <div>
            <h3 data-t="about.outcomes.items.research.title"></h3>
            <p data-t="about.outcomes.items.research.text"></p>
          </div>
        </li>
      </ol>
    </section>

    <section class="selected-work-section"></section>

    <section class="skills-section"></section>

    <section class="values-section"></section>

    <section class="about-closing-section"></section>
  </div>
</div>
