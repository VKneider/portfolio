<div class="teaching-course">
  <div class="teaching-course__breadcrumb"></div>
  <header class="teaching-course__header">
    <p class="teaching-course__eyebrow"></p>
    <h1 class="teaching-course__name"></h1>
    <p class="teaching-course__description"></p>
    <a class="teaching-course__repo" target="_blank" rel="noopener noreferrer" data-t="teaching.viewRepo" hidden></a>
  </header>
  <section class="teaching-course__syllabus" data-t="teaching.syllabusAria" aria-label>
    <div class="teaching-course__section-title"></div>
    <div class="teaching-course__toc"></div>
  </section>
  <div class="teaching-course__not-found" hidden></div>
</div>
