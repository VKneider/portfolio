<article class="certificate-card">
   <div class="certificate-preview-wrap">
      <button class="certificate-preview" type="button">
         <img class="certificate-thumbnail" alt="" loading="lazy" decoding="async">
         <span class="certificate-preview-fallback" aria-hidden="true"></span>
      </button>
   </div>

   <div class="certificate-header">
      <div class="issuer-mark">
         <img class="issuer-logo" alt="">
         <span class="issuer-initials"></span>
      </div>
      <div class="header-text">
         <h3 class="certificate-title"></h3>
         <h4 class="certificate-issuer"></h4>
      </div>
   </div>

   <p class="certificate-description"></p>

   <div class="certificate-meta">
      <span class="certificate-dates"></span>
      <span class="credential-id"></span>
   </div>

   <div class="certificate-skills">
      <h5 data-t="education.certificate.focus"></h5>
      <div class="skills-list"></div>
   </div>

   <div class="certificate-actions"></div>
</article>
