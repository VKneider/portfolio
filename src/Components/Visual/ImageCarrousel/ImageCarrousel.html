<div class="carousel-container">
  <div class="carousel-slides"></div>
  
  <!-- Navegación -->
  <button class="carousel-prev" aria-label="Previous slide" data-t="carousel.prev">❮</button>
  <button class="carousel-next" aria-label="Next slide" data-t="carousel.next">❯</button>
  
  <!-- Indicadores -->
  <div class="carousel-indicators"></div>
  
  <!-- Contador de slides -->
  <div class="carousel-counter">
    <span class="current-slide-number">1</span>
    <span class="counter-separator">/</span>
    <span class="total-slides">0</span>
  </div>
</div>
