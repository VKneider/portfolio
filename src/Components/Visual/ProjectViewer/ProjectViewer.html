<div class="viewer-container">
    <!-- Left Column: Thumbnails List -->
    <div class="thumbnails-column">
        <div class="column-header mobile-hidden">
            <h3 data-t="projects.listTitle"></h3>
        </div>
        <div class="thumbnails-list">
            <!-- Items injected via JS -->
        </div>
        <div class="thumbnails-scroll-hint mobile-only" data-t="projects.scrollHint"></div>
    </div>

    <!-- Center Column: Preview Stage -->
    <div class="preview-column">
        <div class="preview-container">
            <div class="preview-overlay"></div>
            <img class="preview-image" src="" alt="Project Preview" />
        </div>
    </div>

    <!-- Right Column: Details Panel -->
    <div class="details-column">
        <div class="details-panel">
            <div class="details-header">
                <h2 class="project-title" data-t="projects.select"></h2>
                <span class="status-badge"></span>
            </div>
            
            <div class="project-actions"></div>

            <div class="project-description"></div>
            
            <div class="tech-stack-container">
                <h4 data-t="projects.technologies"></h4>
                <div class="tech-list"></div>
            </div>
        </div>
    </div>
</div>

<!-- Image Modal -->
<div class="image-modal">
    <div class="close-modal" data-t="projects.modal.close" aria-label role="button" tabindex="0">&times;</div>
    <button class="modal-nav-btn prev-btn" data-t="projects.modal.prev" aria-label>❮</button>
    <img class="modal-content" id="expanded-image" data-t="projects.modal.image" alt>
    <button class="modal-nav-btn next-btn" data-t="projects.modal.next" aria-label>❯</button>
</div>
